name: Deploy Telegram Bot

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ (!github.event.repository.fork || vars.ENABLE_SELF_HOSTED_DEPLOY == 'true') && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target deployment directory
        id: target
        run: |
          DEPLOY_PATH="${{ vars.DEPLOY_DIR || vars.RUNNER_REPO_DIR || github.workspace }}"
          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          echo "Target deployment directory: $DEPLOY_PATH"

      - name: Pull latest source on runner
        run: |
          RUNNER_REPO_DIR="${{ env.DEPLOY_PATH }}" bash scripts/github-runner-pull.sh

      - name: Create .env file from Secrets
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          cd telegrambot
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
            if [ -n "${{ secrets.TELEGRAM_ALLOWED_USERS }}" ]; then
              echo "TELEGRAM_ALLOWED_USERS=${{ secrets.TELEGRAM_ALLOWED_USERS }}" >> .env
            fi
            echo "BOT_HEALTH_HOST=0.0.0.0" >> .env
            echo "BOT_HEALTH_PORT=8081" >> .env
            echo "BOT_SERVICE_NAME=mpxraspberrypibot" >> .env
          elif [ -f .env ]; then
            echo "Secrets not provided; keeping existing .env"
          fi
          # Debug: Show allowed users count (not values)
          if grep -q "TELEGRAM_ALLOWED_USERS=" .env 2>/dev/null; then
            USERS_VAL=$(grep "TELEGRAM_ALLOWED_USERS=" .env | cut -d"=" -f2-)
            USER_COUNT=$(echo "$USERS_VAL" | tr "," "\n" | wc -l)
            echo "Configured for $USER_COUNT authorized users."
          fi
      - name: Build and Run with Docker Compose
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          cd telegrambot
          # Pre-pull base image with retry to handle transient Docker Hub resets
          for i in 1 2 3 4 5; do
            docker pull python:3.11-slim && break || {
              echo "docker pull failed (attempt $i/5), retrying in 5s..."
              sleep 5
            }
          done
          # Build with host network and retry
          for i in 1 2 3; do
            docker build --network=host -t mpxraspberrypibot . && break || {
              echo "docker build failed (attempt $i/3), retrying in 5s..."
              sleep 5
            }
          done
          docker compose down --remove-orphans || true
          docker compose up -d
          docker compose logs --tail=80
          sleep 5
          docker compose ps

      - name: Verify Deployment
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          cd telegrambot
          if docker compose ps | grep -q "Up"; then
            echo "✅ Telegram Bot deployed successfully!"
          else
            echo "❌ Deployment failed or container not running."
            docker compose logs
            exit 1
          fi
