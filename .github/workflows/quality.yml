name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn shellcheck
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r telegrambot/requirements.txt

      - name: ShellCheck
        run: shellcheck .githooks/pre-commit setup.sh uninstall.sh configs/20-hotspot-manager configs/90-hotspot-vpn-policy configs/95-hotspot-wan-trigger scripts/openvpn-replay-wrapper scripts/openvpn-diversion.sh scripts/github-vpn-routes.sh scripts/apply-routes.sh scripts/github-runner-pull.sh scripts/auto-commit.sh tests/test-auto-commit.sh tests/test-vpn-scripts.sh

      - name: Auto-commit integration tests
        run: tests/test-auto-commit.sh

      - name: VPN restart regression tests
        run: |
          python -m unittest -v tests/test_hotspot_manager.py
          bash -x tests/test-vpn-scripts.sh

      - name: Telegram bot unit tests
        run: python -m unittest -v tests/test_telegram_bot.py

      - name: Codebase analysis verification
        run: .agents/skills/vpn-codebase-analysis/scripts/analyze.sh

      - name: Black check
        run: black --check --exclude="telegrambot/.venv|venv|\.git|__pycache__" scripts/ tests/ telegrambot/

      - name: Flake8
        run: flake8 --max-line-length=88 --extend-ignore=E203,W503 --exclude=telegrambot/.venv,telegrambot/venv,.venv,venv scripts/ tests/ telegrambot/
