# GoodWifi Project Configuration
# Automatically installed to /etc/goodwifi/goodwifi.conf by setup.sh

# Preferred VPN backend: "auto", "sing0", "awg0", "wg0", or "tun0"
# "auto" detects any active VPN interface (sing0 > awg0 > wg0 > tun0)
VPN_BACKEND="auto"

# VPN MTU (e.g. 1280 for mobile tethering/AmneziaWG/WireGuard, 1400 for OpenVPN)
# Leave unset or empty to use automatic per-interface defaults
VPN_MTU=""

# OpenVPN ping restart timeout for high-latency mobile networks (default: 20s, recommended for mobile: 60s)
OPENVPN_PING_RESTART="60s"

# OpenVPN NetworkManager connection profile name or UUID
# Leave empty (default) to automatically detect any VPN connection from NetworkManager
VPN_UUID=""

# Policy routing ipset names
VPN_ROUTES_IPSET="vpn_routes"
LOCAL_ROUTES_IPSET="local_routes"

# Network Interfaces & Wi-Fi Hotspot
HOTSPOT_SSID="GoodWifi"
HOTSPOT_IF="wlan0"
HOTSPOT_SUBNET="10.42.0.0/24"
HOTSPOT_IP="10.42.0.1"
LAN_IF="eth0"

# IPv6 leak protection for Wi-Fi hotspot clients:
# "reject" : Reject client IPv6 forwarding with ICMPv6 unreachable (default; fail-fast prevents client timeouts)
# "drop"   : Silently drop client IPv6 forwarding (prevents VPN bypass / IPv6 leak)
# "off"    : Allow IPv6 forwarding (use only if your VPN provides full dual-stack IPv6 routing)
IPV6_LEAK_PROTECTION="reject"

# Docker Container names for service status monitoring
ADGUARD_CONTAINER="adguardhome"
TELEGRAM_CONTAINER="mpxraspberrypibot"

# AdGuard Home DNS & ad-blocking service:
# "true"  : AdGuard Home container handles DNS on 10.42.0.1:53 (default)
# "false" : AdGuard Home is stopped; dnsmasq handles upstream DNS on 10.42.0.1:53
ADGUARD_ENABLED="true"

# Remote VPS OpenVPN Exit Switcher:
# Explicitly pinned to connect.hhk.my.id (IONOS Kansas City)
VPS_SSH_HOST="connect.hhk.my.id"
VPS_SSH_PORT="2222"
VPS_SSH_USER="root"

