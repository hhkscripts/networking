services:
  mpxraspberrypibot:
    build: .
    image: mpxraspberrypibot
    container_name: mpxraspberrypibot
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - mpxraspberrypinetwork
    privileged: true
    pid: "host"
    ipc: "host"
    uts: "host"
    environment:
      - TZ=Asia/Yangon
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TELEGRAM_ALLOW_ALL_USERS=${TELEGRAM_ALLOW_ALL_USERS:-false}
      - BOT_HEALTH_HOST=${BOT_HEALTH_HOST:-0.0.0.0}
      - BOT_HEALTH_PORT=8081
      - BOT_SERVICE_NAME=mpxraspberrypibot
    volumes:
      - /:/host:rw
      - /var/run/dbus:/var/run/dbus
      - /run/systemd:/run/systemd
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app:ro
      - /etc/hostapd:/etc/hostapd
      - /etc/dnsmasq.d:/etc/dnsmasq.d
      - /run/xtables.lock:/run/xtables.lock
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    working_dir: /app
    command: >
      bash -c "
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin &&
        exec python3 bot.py
      "
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/bot-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mpxraspberrypinetwork:
    name: mpxraspberrypinetwork
